services:
  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
      - grpc_scheduler
  inference_backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.triton
    ports:
      - "8001:8000"
  simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulator
    depends_on:
      - scheduler
      - ray_head
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
      POSTGRES_DB: ${POSTGRES_DB:-nimbusmesh}
    ports:
      - "5432:5432"
  metrics_exporter:
    image: prom/prometheus
    ports:
      - "9090:9090"
  grpc_scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.scheduler
    command: ["python", "scripts/run_grpc_server.py", "--host", "0.0.0.0", "--port", "50051"]
    ports:
      - "50051:50051"
  ray_head:
    image: rayproject/ray:2.30.0
    command: ["ray", "start", "--head", "--port=6379", "--dashboard-host=0.0.0.0", "--block"]
    ports:
      - "8265:8265"
